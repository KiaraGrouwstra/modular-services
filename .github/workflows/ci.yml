name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM: x86_64-linux

jobs:
  # Evaluates every output and instantiates every check without running a single
  # virtual machine, then hands the two job matrices to the tiers below.
  gate:
    runs-on: ubuntu-latest
    outputs:
      eval: ${{ steps.matrix.outputs.eval }}
      vm: ${{ steps.matrix.outputs.vm }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: modular-services
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Forks and pull requests have no token; stay read-only there.
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Evaluate the flake
        # `nix flake check` on its own would build the checks, virtual machines
        # included. `--no-build` keeps this tier at about a minute.
        run: nix flake check --no-build -L

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Compute the matrices
        id: matrix
        run: |
          m=$(nix eval --json ".#ci.$SYSTEM.matrix")
          echo "eval=$(jq -c '{include: [.include[] | select(.kind == "eval")]}' <<<"$m")" >>"$GITHUB_OUTPUT"
          echo "vm=$(jq -c '{include: [.include[] | select(.kind == "vm")]}' <<<"$m")" >>"$GITHUB_OUTPUT"

  # Checks that build without a virtual machine, so any runner will do.
  eval-checks:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.eval) }}
    name: eval (${{ matrix.integration }}) ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: modular-services
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build ${{ matrix.name }}
        run: nix build -L --no-link ".#checks.$SYSTEM.${{ matrix.name }}"

  # Publishes the manual to GitHub Pages.
  #
  # `gate` has already built it as `checks.docs`, so this only runs where there
  # is somewhere to publish to: a repository has one Pages site, and a pull
  # request must not replace what `main` put there.
  pages:
    needs: gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deploys are not interchangeable the way check runs are: cancelling one
    # mid-flight leaves the site as whatever the last complete deploy left.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: modular-services
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the manual
        run: nix build -L --out-link result ".#packages.$SYSTEM.docs"

      - name: Collect the site
        # Out of the store, because the artifact is uploaded by path and every
        # file there is read-only.
        run: |
          mkdir site
          cp -rL result/share/doc/nixos/. site/
          chmod -R u+w site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  # Checks that boot a virtual machine, so they need KVM and rather more disk.
  vm-tests:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.vm) }}
    name: vm (${{ matrix.integration }}) ${{ matrix.name }}
    steps:
      - name: Free disk space
        # A VM test closure does not fit in the ~14 GB a fresh runner has left.
        # Pinned to a tag rather than a branch so Dependabot can see it.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # The runner needs its swap; reclaiming it trades disk for OOM kills.
          swap-storage: false

      - name: Grant access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          # Tests that declare `containers` rather than `nodes` run under
          # `systemd-nspawn`, which needs pid 0 inside the build sandbox. That
          # is what the `uid-range` system feature grants, and Nix only honours
          # it with `auto-allocate-uids`. `nixos-pkg-php-fpm` is one such test.
          #
          # `experimental-features` spells out `nix-command flakes` as well:
          # the action adds those two itself only while `extra_nix_config`
          # mentions no form of the setting at all, so naming it here means
          # naming the whole list.
          extra_nix_config: |
            auto-allocate-uids = true
            extra-system-features = uid-range
            experimental-features = nix-command flakes auto-allocate-uids cgroups
      - uses: cachix/cachix-action@v17
        with:
          name: modular-services
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Assert the runner can run the tests
        # Without this a lost KVM would not fail the job, it would just make
        # every VM test crawl under software emulation until the runner times
        # out, and a lost `uid-range` would fail each container test with a
        # message about Nix settings rather than about the test. Fail loudly.
        run: |
          test -c /dev/kvm
          features=$(nix config show system-features | tr ' ,' '\n\n')
          grep -qx kvm <<<"$features"
          grep -qx uid-range <<<"$features"

      - name: Build ${{ matrix.name }}
        run: nix build -L --no-link ".#checks.$SYSTEM.${{ matrix.name }}"
