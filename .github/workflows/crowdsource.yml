name: Crowdsource

# Keeps doc/design/crowdsource/ level with the discussions it tracks.
#
# The corpus is only useful if it is current, and a directory nobody remembers
# to refresh goes stale silently -- it still answers questions, just with last
# quarter's answers. So the refresh runs on a schedule and arrives as a pull
# request, where the diff is the report: every comment the world added since
# the last run, in place, reviewable.
on:
  schedule:
    # Weekly. The meetings are fortnightly and the pull requests move daily, so
    # this is often enough to be worth reading and rare enough to be read.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # On a pull request that touches the tooling, check the tooling still runs
  # rather than opening anything.
  pull_request:
    paths:
      - doc/design/crowdsource/sync.py
      - doc/design/crowdsource/sources.json
      - .github/workflows/crowdsource.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # `--check` on a pull request: it fetches, compares and writes nothing, so
      # it proves the tool works against the live APIs without the job needing
      # anywhere to put the result.
      #
      # Exit 1 means the corpus is behind, which is the normal state between
      # refreshes and not this job's business. Anything else is the tool
      # failing, and that is what a pull request touching it must not do -- so
      # the two are told apart rather than both swallowed by `|| true`.
      - name: Check the sources are reachable
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          nix run .#crowdsource-sync -- --check
          status=$?
          set -e
          case "$status" in
            0) echo "corpus is current" ;;
            1) echo "corpus is behind; nothing to do on a pull request" ;;
            *) echo "crowdsource-sync failed with $status"; exit "$status" ;;
          esac

      - name: Refresh
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#crowdsource-sync

      # `add-paths` confines the commit to the corpus: a scheduled job that can
      # commit anything else is a scheduled job that will, eventually.
      - name: Open a pull request for what moved
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: doc/design/crowdsource/**
          branch: crowdsource/refresh
          delete-branch: true
          commit-message: |
            doc(crowdsource): refresh the design record

            Generated by .github/workflows/crowdsource.yml.
          title: "doc(crowdsource): refresh the design record"
          body: |
            Automatic refresh of `doc/design/crowdsource/`.

            The diff is the report. Worth a look before merging:

            - **`state/discovered.json`** -- links the corpus now mentions that
              nothing tracks. Anything near the top of that list wants either a
              `sources.json` entry or a line in `ignore`.
            - **`state/queries.json`** -- what each search matched, and what a
              `match`/`exclude` filter dropped. A query that suddenly matches
              nothing has usually been outlived by a rename.
            - **New files under `raw/`** -- a thread that entered the record on
              its own, via a query rather than a decision.

            Nothing here needs merging urgently; an out-of-date corpus is worse
            than a stale pull request, but not by much.
