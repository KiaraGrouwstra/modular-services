# Two ecosystems, both opening pull requests so the check suite runs against a
# bump before anyone merges it.
#
# `nix` updates `flake.lock` by running `nix flake update <input>`. It follows
# whatever the input already tracks rather than moving between them, so the
# `nixos-unstable` channel pin in flake.nix keeps resolving to newer channel
# revisions and never jumps to a release channel on its own.
#
# `github-actions` updates the `uses:` refs in .github/workflows/, grouped into
# one pull request rather than one per action.
#
# No `labels`, deliberately. Naming labels here replaces the defaults with ones
# Dependabot expects to already exist, and silently drops any that do not. Left
# alone it applies `dependencies` plus one label per ecosystem, creating them in
# the repository as needed.
version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
